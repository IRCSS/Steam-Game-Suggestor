name: check

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json
      - run: uv python install 3.12
      - run: npm run setup
      - run: npx playwright install-deps chromium
      - run: npm run check
      # The original data file is local-only; without it the backend tests that need it are
      # skipped and the end-to-end suite (legacy parity against that file) cannot run.
      - run: npm run test-e2e
        if: hashFiles('reference/steam_game_suggester.html') != ''
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright
          path: |
            test-results/
            playwright-report/
          retention-days: 7
